name: Create and publish multi-arch Docker images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push-images:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nginx-alpine
            context: ./nginx-alpine
            image: ticketz-oss/nginx-alpine
            title: ticketz-nginx-alpine
          - name: nginx-alpine-slim
            context: ./nginx-alpine-slim
            image: ticketz-oss/nginx-alpine-slim
            title: ticketz-nginx-alpine-slim
          - name: ticketz-node-24
            context: ./node
            image: ticketz-oss/ticketz-node-24
            title: ticketz-node-24
          - name: ticketz-node-26
            context: ./node-26
            image: ticketz-oss/ticketz-node-26
            title: ticketz-node-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

      - name: Generate artifact attestation
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Run Trivy vulnerability scanner
        id: trivy
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && steps.build.outputs.digest != ''
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results-${{ matrix.name }}.sarif

      - name: Upload Trivy scan results to GitHub Security tab
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && steps.trivy.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Add job summary
        if: always()
        run: |
          echo "## ${{ matrix.title }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Context:** ${{ matrix.context }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Push requested:** ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build result:** ${{ steps.build.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.build.outputs.digest }}" ]; then
            echo "- **Digest:** ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          fi
